name: Release importer

on:
  push:
    tags:
      - 'importer-*'

permissions:
  contents: read

concurrency:
  group: importer-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^importer-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a tag such as importer-1.2.0" >&2
            exit 1
          fi
          echo "IMPORTER_VERSION=${GITHUB_REF_NAME#importer-}" >> "$GITHUB_ENV"

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          cache: maven
          distribution: temurin
          java-version: '25'

      - name: Set importer version from tag
        run: |
          ./mvnw -B -ntp -f importer/pom.xml \
            org.codehaus.mojo:versions-maven-plugin:2.23.0:set \
            -DnewVersion="$IMPORTER_VERSION" \
            -DgenerateBackupPoms=false \
            -DprocessFromLocalAggregationRoot=false

      - name: Build and test importer and query library
        run: ./mvnw -B -ntp -pl importer -am clean verify

      - name: Check executable JAR and generate checksum
        working-directory: importer/target
        run: |
          java -jar hibp-passwords-importer.jar --help
          sha256sum hibp-passwords-importer.jar > hibp-passwords-importer.jar.sha256

      - name: Publish GitHub release assets
        working-directory: importer/target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              hibp-passwords-importer.jar hibp-passwords-importer.jar.sha256 \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              hibp-passwords-importer.jar hibp-passwords-importer.jar.sha256 \
              --verify-tag \
              --title "Importer $IMPORTER_VERSION" \
              --generate-notes
          fi
